<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brika-Landing</title>
    <link rel="stylesheet" href="css/components/header.css">
    <script src="js/components/home.js"></script>
    <link rel="stylesheet" href="css/components/footer.css">
    <link rel="stylesheet" href="css/components/encomenda.css">
    <link rel="stylesheet" href="css/components/home.css">
    <link rel="stylesheet" href="css/pages/index.css">
    <link rel="stylesheet" href="css/components/character-card.css">
    <link rel="stylesheet" href="css/pages/personagens.css">
    <script src="js/components/character-card.js"></script>
    <script src="js/pages/personagens.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="logo-wrap">
                <img src="assets/icons/logo.svg" alt="Brinka" class="logo">
            </div>

            <div class="search-wrap" role="search" aria-label="Buscar por categoria">
                <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>

                <input
                    class="search-input"
                    type="search"
                    placeholder="Buscar por categoria"
                    aria-label="Buscar por categoria"
                >
            </div>

            <div class="actions-wrap">
                <button class="btn btn-login" type="button">
                    <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Entrar
                </button>

                <button class="btn btn-cart" type="button">
                    <svg class="btn-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    Carrinho <span class="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>
    <main>
        <section class="home-section" aria-label="Início">
            <img
                src="assets/icons/Group 81.svg"
                alt=""
                class="home-background-svg"
                aria-hidden="true"
            >

            <h1 class="home-heading">
                <img
                    src="assets/icons/title-home.svg"
                    alt="Brinka"
                    class="home-title-svg"
                >
            </h1>

            <div class="home-buttons" aria-label="Ações principais">
                <button
                    class="home-btn active"
                    type="button"
                    aria-pressed="true"
                    data-target="personagens"
                >
                    Ver coleção
                </button>

                <button
                    class="home-btn"
                    type="button"
                    aria-pressed="false"
                    data-target="encomenda"
                >
                    Encomendar
                </button>
            </div>

            <img
                src="assets/icons/personagnes.svg"
                alt=""
                class="home-bottom-svg"
                aria-hidden="true"
            >
        </section>
        <section id="personagens" class="personagens-section">

            <header class="ps-header">
                <h2 id="personagens-heading-1" class="ps-title">
                    <img
                        src="assets/icons/nossosP.svg"
                        alt="Nossos Personagens"
                        class="ps-title-svg"
                    >
                </h2>

                <span class="status-catalog">Disponível</span>
            </header>

            <div class="catalog-tabs" role="group" aria-label="Categorias">
                <button type="button" aria-pressed="true">Todos</button>
                <button type="button" aria-pressed="false">Clássicos</button>
                <button type="button" aria-pressed="false">Especiais</button>
                <button type="button" aria-pressed="false">Novos</button>
                <button type="button" aria-pressed="false">Promoções</button>
            </div>

            <div class="ps-live-region ps-sr-only" role="status" aria-live="polite"></div>
            <ul class="catalog-card-grid" aria-labelledby="personagens-heading-1">
                <li><character-card name="Mari Marrão" color-from="#DF7A96" color-to="#F6356B" img="assets/images/mari-marrao.png" desc="boina branca, cabelo cacheado castanho, jardineira jeans"></character-card></li>
                <li><character-card name="Erick Santos" color-from="#26AACE" color-to="#287488" img="assets/images/erick-santos.png" desc="moletom cinza com manchas verdes, fazendo sinal de paz"></character-card></li>
                <li><character-card name="Rahquel Emido" color-from="#a9852c" color-to="#d4b13a" img="assets/images/rahquel-korzh.png" desc="óculos redondos, blusa listrada, cabelo longo escuro"></character-card></li>
                <li><character-card name="João Souza" color-from="#ADBF35" color-to="#676F2C" img="assets/images/joao-souza.png" desc="moletom cinza escrito New York, cabelo cacheado"></character-card></li>
                <li><character-card name="Vinícius Boas" color-from="#AA4B19" color-to="#FF823F" img="assets/images/vini-vilas.png" desc="óculos, moletom preto, copo de café na mão"></character-card></li>
                <li><character-card name="Isepe Nic" color-from="#864ECE" color-to="#4C2085" img="assets/images/isepe.png" desc="óculos, camiseta amarela estampada, cabelo castanho"></character-card></li>
                <li><character-card name="Samuel" color-from="#AA1919" color-to="#DC6767" img="assets/images/samuca.png" desc="óculos, camiseta amarela estampada, cabelo castanho"></character-card></li>
            </ul>

        </section>

        <section id="encomenda" class="encomende-section" aria-labelledby="encomende-title">
            <div class="encomende-content">
                <h2 id="encomende-title">
                    <img
                        src="assets/icons/encomende.svg"
                        alt="Encomende"
                        class="encomende-svg"
                    >
                </h2>

                <button class="encomende-btn" type="button">
                    Encomendar

                    <svg class="encomende-btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M16.69 12.47 3.51 13.26c-.31 0-.47.16-.47.31L1.15 20.02c-.31.79-.16 1.88.63 2.5.63.47 1.73.58 2.35.32l17.58-8.8c.94-.47 1.41-1.41 1.26-2.36L4.13 1.16c-.78-.26-1.73-.16-2.35.31-.79.63-.94 1.57-.63 2.52l1.89 6.44c0 .16.31.32.47.32l13.18.79s.47 0 .47.47-.47.47-.47.47Z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </section>

        <footer class="site-footer">
            <div class="footer-content">
                <div class="links-wrap">
                    <nav class="footer-links" aria-label="Links rápidos">
                        <h2>Links rápidos</h2>
                        <a href="#">Home</a>
                        <a href="#">Carrinho</a>
                        <a href="#">Encomendar</a>
                    </nav>

                    <div class="footer-contact">
                        <h2>Contatos</h2>
                        <p>@brinka</p>
                        <p>11 95064-6508</p>
                    </div>
                </div>

                <div class="footer-logo">
                    <img src="assets/icons/logo.svg" alt="Brinka" class="footer-logo-img">
                </div>
            </div>
        </footer>
    </main>
</body>
</html>
