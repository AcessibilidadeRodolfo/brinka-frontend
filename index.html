<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brika-Landing</title>
    <link rel="stylesheet" href="css/pages/index.css">
    <link rel="stylesheet" href="css/components/character-card.css">
    <link rel="stylesheet" href="css/pages/personagens.css">
    <script src="js/components/character-card.js"></script>
    <script src="js/pages/personagens.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <div class="logo-wrap">
            </div>
            <div class="search-wrap">
                <input class="search-input" type="search" placeholder="Buscar por categoria">
            </div>
            <div class="actions-wrap">
                <button class="btn btn-login">Entrar</button>
                <button class="btn btn-cart">Carrinho <span class="cart-count">0</span></button>
            </div>
        </div>
    </header>
    <main>
        <section class="personagens-section">

            <header class="ps-header">
                <h2  id="personagens-heading-1" class="ps-title">
                    Nossos Personagens
                </h2>
                <span class="status-catalog">Disponível</span>
            </header>

            <div role="tablist" aria-label="Categorias" class="catalog-tabs">
                <button role="tab" aria-selected="true" tabindex="0">Todos</button>
                <button role="tab" aria-selected="false" tabindex="-1">Clássicos</button>
                <button role="tab" aria-selected="false" tabindex="-1">Especiais</button>
                <button role="tab" aria-selected="false" tabindex="-1">Novos</button>
                <button role="tab" aria-selected="false" tabindex="-1">Promoções</button>
            </div>

            <div class="ps-live-region ps-sr-only" role="status" aria-live="polite"></div>

            <ul class="catalog-card-grid" aria-labelledby="personagens-heading-1">
                <li><character-card name="Mari Marrão" color-from="#d6256e" color-to="#f0507c" img="assets/images/mari-marrao.png" desc="boina branca, cabelo cacheado castanho, jardineira jeans"></character-card></li>
                <li><character-card name="Erick Santos" color-from="#1f6e8c" color-to="#2596be" desc="moletom cinza com manchas verdes, fazendo sinal de paz"></character-card></li>
                <li><character-card name="Rahquel Emido" color-from="#a9852c" color-to="#d4b13a" desc="óculos redondos, blusa listrada, cabelo longo escuro"></character-card></li>
                <li><character-card name="João Souza" color-from="#7a9a2e" color-to="#a3c93f" desc="moletom cinza escrito New York, cabelo cacheado"></character-card></li>
                <li><character-card name="Vinícius Boas" color-from="#c2581c" color-to="#e8862f" desc="óculos, moletom preto, copo de café na mão"></character-card></li>
                <li><character-card name="Isepe Nic" color-from="#5b3aa0" color-to="#7d5bc4" desc="óculos, camiseta amarela estampada, cabelo castanho"></character-card></li>
            </ul>

        </section>
    </main>
</body>
</html>
