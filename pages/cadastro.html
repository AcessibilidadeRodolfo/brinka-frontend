<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer cadastro | Brinka</title>
    <meta name="description" content="Crie sua conta Brinka para começar a comprar no seu vilarejo.">
    <meta name="application-name" content="Brinka">
    <meta name="theme-color" content="#272727">
    <link rel="icon" href="../assets/icons/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components/auth/base.css">
    <link rel="stylesheet" href="../css/components/auth/layout.css">
    <link rel="stylesheet" href="../css/components/auth/buttons.css">
    <link rel="stylesheet" href="../css/components/auth/form.css">
    <link rel="stylesheet" href="../css/components/auth/stepper.css">
    <link rel="stylesheet" href="../css/pages/cadastro.css">
</head>
<body class="auth-page auth-page--cadastro">
    <a class="skip-link" href="#cadastro-form">Pular para o formulário de cadastro</a>

    <div class="auth-layout">
        <a href="login.html" class="btn btn--pink auth-layout__switch-action">
            <span class="auth-layout__switch-label">Fazer Login</span>
        </a>

        <main id="conteudo-principal" class="auth-layout__content">
            <div class="auth-layout__card">
                <a href="../index.html" class="btn btn--ghost auth-layout__back-action" aria-label="Voltar para a página inicial">
                    <span aria-hidden="true">←</span>
                    <span>Voltar ao início</span>
                </a>
                <header class="auth-header">
                    <img
                        src="../assets/icons/logo.svg"
                        alt="Brinka"
                        class="auth-header__logo"
                        width="210"
                        height="150"
                    >
                    <h1 class="auth-header__title">Fazer Cadastro</h1>
                    <p class="auth-header__subtitle">
                        Insira suas informações para prosseguirmos com seu cadastro
                    </p>
                </header>

                <p id="cadastro-status" class="sr-only" role="status" aria-live="polite"></p>
                <div id="cadastro-feedback" class="form-feedback" role="alert" aria-live="assertive"></div>

                <form id="cadastro-form" class="auth-form" novalidate>
                    <fieldset class="auth-form__step" data-step="0" id="step-0">
                        <legend class="sr-only">Dados pessoais</legend>

                        <div class="input-field">
                            <label class="input-field__label sr-only" for="nome">Nome</label>
                            <input
                                class="input-field__control"
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Nome completo"
                                autocomplete="name"
                                aria-describedby="nome-erro"
                            >
                            <span class="input-field__icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false">
                                    <circle cx="12" cy="8" r="4" fill="currentColor"></circle>
                                    <path d="M4 21a8 8 0 0 1 16 0H4Z" fill="currentColor"></path>
                                </svg>
                            </span>
                            <p class="input-field__error" id="nome-erro" role="alert"></p>
                        </div>

                        <div class="input-field">
                            <label class="input-field__label sr-only" for="email">E-mail</label>
                            <input
                                class="input-field__control"
                                type="email"
                                id="email"
                                name="email"
                                placeholder="E-mail"
                                autocomplete="email"
                                aria-describedby="email-erro"
                            >
                            <span class="input-field__icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false">
                                    <path d="M3 5h18v14H3V5Zm2 2v.5l7 5 7-5V7H5Zm14 10V10l-7 5-7-5v7h14Z" fill="currentColor"></path>
                                </svg>
                            </span>
                            <p class="input-field__error" id="email-erro" role="alert"></p>
                        </div>

                        <div class="input-field">
                            <label class="input-field__label sr-only" for="telefone">Telefone</label>
                            <input
                                class="input-field__control"
                                type="tel"
                                id="telefone"
                                name="telefone"
                                placeholder="Telefone"
                                inputmode="tel"
                                autocomplete="tel"
                                aria-describedby="telefone-erro"
                            >
                            <span class="input-field__icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false">
                                    <path d="M6.6 2 10 5.4 8.1 8.1c1.3 2.7 3.1 4.5 5.8 5.8l2.7-1.9L20 15.4V20c-9.9.6-16.6-6.1-16-16h2.6Z" fill="currentColor"></path>
                                </svg>
                            </span>
                            <p class="input-field__error" id="telefone-erro" role="alert"></p>
                        </div>

                        <div class="input-field">
                            <label class="input-field__label sr-only" for="senha">Senha</label>
                            <input
                                class="input-field__control"
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Senha"
                                autocomplete="new-password"
                                aria-describedby="senha-erro"
                            >
                            <button
                                type="button"
                                id="toggle-senha"
                                class="input-field__icon-button"
                                aria-pressed="false"
                                aria-label="Mostrar senha"
                            >
                                <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                                    <path d="M7 10V8a5 5 0 0 1 10 0v2h1a2 2 0 0 1 2 2v8H4v-8a2 2 0 0 1 2-2h1Zm2 0h6V8a3 3 0 0 0-6 0v2Z" fill="currentColor"></path>
                                </svg>
                            </button>
                            <p class="input-field__error" id="senha-erro" role="alert"></p>
                        </div>

                        <div class="input-field">
                            <label class="input-field__label sr-only" for="confirmar-senha">Confirmar senha</label>
                            <input
                                class="input-field__control"
                                type="password"
                                id="confirmar-senha"
                                name="confirmar-senha"
                                placeholder="Confirmar senha"
                                autocomplete="new-password"
                                aria-describedby="confirmar-senha-erro"
                            >
                            <button
                                type="button"
                                id="toggle-confirmar-senha"
                                class="input-field__icon-button"
                                aria-pressed="false"
                                aria-label="Mostrar senha"
                            >
                                <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                                    <path d="M7 10V8a5 5 0 0 1 10 0v2h1a2 2 0 0 1 2 2v8H4v-8a2 2 0 0 1 2-2h1Zm2 0h6V8a3 3 0 0 0-6 0v2Z" fill="currentColor"></path>
                                </svg>
                            </button>
                            <p class="input-field__error" id="confirmar-senha-erro" role="alert"></p>
                        </div>
                    </fieldset>

                    <fieldset class="auth-form__step" data-step="1" id="step-1" hidden aria-hidden="true">
                        <legend class="sr-only">Endereço</legend>

                        <div class="input-field">
                            <label class="input-field__label sr-only" for="cep">CEP</label>
                            <input
                                class="input-field__control"
                                type="text"
                                id="cep"
                                name="cep"
                                placeholder="CEP"
                                inputmode="numeric"
                                autocomplete="postal-code"
                                aria-describedby="cep-erro"
                            >
                            <span class="input-field__icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false">
                                    <path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7Zm0 4a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z" fill="currentColor"></path>
                                </svg>
                            </span>
                            <p class="input-field__error" id="cep-erro" role="alert"></p>
                        </div>

                        <div class="auth-form__row">
                            <div class="input-field input-field--sm">
                                <label class="input-field__label sr-only" for="uf">Estado</label>
                                <input
                                    class="input-field__control input-field__control--plain"
                                    type="text"
                                    id="uf"
                                    name="uf"
                                    placeholder="SP"
                                    maxlength="2"
                                    autocomplete="address-level1"
                                    aria-describedby="uf-erro"
                                >
                                <p class="input-field__error" id="uf-erro" role="alert"></p>
                            </div>

                            <div class="input-field input-field--grow">
                                <label class="input-field__label sr-only" for="cidade">Cidade</label>
                                <input
                                    class="input-field__control input-field__control--plain"
                                    type="text"
                                    id="cidade"
                                    name="cidade"
                                    placeholder="Cidade"
                                    autocomplete="address-level2"
                                    aria-describedby="cidade-erro"
                                >
                                <p class="input-field__error" id="cidade-erro" role="alert"></p>
                            </div>

                            <div class="input-field input-field--sm">
                                <label class="input-field__label sr-only" for="numero">Número</label>
                                <input
                                    class="input-field__control input-field__control--plain"
                                    type="text"
                                    id="numero"
                                    name="numero"
                                    placeholder="N°"
                                    inputmode="numeric"
                                    autocomplete="address-line2"
                                    aria-describedby="numero-erro"
                                >
                                <p class="input-field__error" id="numero-erro" role="alert"></p>
                            </div>
                        </div>

                        <div class="input-field">
                            <label class="input-field__label sr-only" for="bairro">Bairro</label>
                            <input
                                class="input-field__control input-field__control--plain"
                                type="text"
                                id="bairro"
                                name="bairro"
                                placeholder="Bairro"
                                autocomplete="address-level3"
                                aria-describedby="bairro-erro"
                            >
                            <p class="input-field__error" id="bairro-erro" role="alert"></p>
                        </div>

                        <div class="input-field">
                            <label class="input-field__label sr-only" for="rua">Rua</label>
                            <input
                                class="input-field__control input-field__control--plain"
                                type="text"
                                id="rua"
                                name="rua"
                                placeholder="Rua"
                                autocomplete="address-line1"
                                aria-describedby="rua-erro"
                            >
                            <p class="input-field__error" id="rua-erro" role="alert"></p>
                        </div>
                    </fieldset>

                    <ol class="stepper" aria-hidden="true">
                        <li class="stepper__item" data-state="active"></li>
                        <li class="stepper__item" data-state="upcoming"></li>
                    </ol>

                    <div class="auth-form__actions">
                        <button type="button" id="btn-voltar" class="btn btn--ghost" hidden>Voltar</button>
                        <button type="submit" id="btn-avancar" class="btn btn--cyan auth-form__submit">
                            Avançar
                        </button>
                    </div>
                </form>
            </div>
        </main>

        <aside class="auth-layout__brand-panel" aria-hidden="true">
            <img
                class="auth-layout__brand-title-image"
                src="../assets/icons/title-home.svg"
                alt=""
                width="778"
                height="172"
            >
        </aside>
    </div>

    <script src="../js/utils/config.js"></script>
    <script type="module" src="../js/pages/cadastro.js"></script>
</body>
</html>
