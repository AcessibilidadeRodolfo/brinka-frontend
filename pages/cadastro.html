<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fazer Cadastro | Brinka</title>
  <meta name="description" content="Crie sua conta Brinka para começar a comprar no seu vilarejo." />

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/components/cadastro/base.css" />
  <link rel="stylesheet" href="/css/components/cadastro/buttons.css" />
  <link rel="stylesheet" href="/css/components/cadastro/inputs.css" />
  <link rel="stylesheet" href="/css/components/cadastro/stepper.css" />
  <link rel="stylesheet" href="/css/components/cadastro/auth-layout.css" />
  <link rel="stylesheet" href="/css/pages/cadastro.css" />
</head>
<body>
  <div class="auth-layout">
    <a href="login.html" class="btn btn--pink auth-layout__switch-action">
      Fazer Login
    </a>

    <main class="auth-layout__content">
      <div class="auth-layout__card">
        <header class="cadastro-header">
            <img src="../assets/icons/logo.svg" alt="Brinka" class="logo" width="210" height="150" />
          <h1 class="cadastro-header__title">Fazer Cadastro</h1>
          <p class="cadastro-header__subtitle">
            Insira suas informações para prosseguirmos com seu cadastro
          </p>
        </header>

        <p id="cadastro-status" class="sr-only" role="status" aria-live="polite"></p>
        <div id="cadastro-feedback" class="form-feedback" role="alert" aria-live="assertive"></div>
        <form id="cadastro-form" class="cadastro-form" novalidate>
          <!-- Etapa 1 — Dados pessoais -->
          <fieldset class="cadastro-step" data-step="0" id="step-0">
            <legend class="sr-only">Dados pessoais</legend>

            <div class="input-field">
              <label class="input-field__label sr-only" for="nome">Nome</label>
              <input
                class="input-field__control"
                type="text"
                id="nome"
                name="nome"
                placeholder="Nome"
                autocomplete="name"
                aria-describedby="nome-erro"
              />
              <p class="input-field__error" id="nome-erro" role="alert"></p>
            </div>

            <div class="input-field">
              <label class="input-field__label sr-only" for="email">E-mail</label>
              <input
                class="input-field__control"
                type="email"
                id="email"
                name="email"
                placeholder="E-mail"
                autocomplete="email"
                aria-describedby="email-erro"
              />
              <p class="input-field__error" id="email-erro" role="alert"></p>
            </div>

            <div class="input-field">
              <label class="input-field__label sr-only" for="telefone">Telefone</label>
              <input
                class="input-field__control"
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="Telefone"
                inputmode="tel"
                autocomplete="tel"
                aria-describedby="telefone-erro"
              />
              <p class="input-field__error" id="telefone-erro" role="alert"></p>
            </div>

            <div class="input-field">
              <label class="input-field__label sr-only" for="senha">Senha</label>
              <input
                class="input-field__control"
                type="password"
                id="senha"
                name="senha"
                placeholder="Senha"
                autocomplete="new-password"
                aria-describedby="senha-erro"
              />
              <button
                type="button"
                id="toggle-senha"
                class="input-field__icon input-field__icon--button"
                aria-pressed="false"
                aria-label="Mostrar senha"
              >
                <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                  <path d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7Zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9Z" fill="currentColor"/>
                </svg>
              </button>
              <p class="input-field__error" id="senha-erro" role="alert"></p>
            </div>
            
            <div class="input-field">
              <label class="input-field__label sr-only" for="confirmar-senha">Confirmar senha</label>
              <input
                class="input-field__control"
                type="password"
                id="confirmar-senha"
                name="confirmar-senha"
                placeholder="Confirmar senha"
                autocomplete="new-password"
                aria-describedby="confirmar-senha-erro"
              />
              <button
                type="button"
                id="toggle-confirmar-senha"
                class="input-field__icon input-field__icon--button"
                aria-pressed="false"
                aria-label="Mostrar senha"
              >
                <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                  <path d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7Zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9Z" fill="currentColor"/>
                </svg>
              </button>
              <p class="input-field__error" id="confirmar-senha-erro" role="alert"></p>
            </div>
          </fieldset>

          <!-- Etapa 2 — Endereço -->
          <fieldset class="cadastro-step" data-step="1" id="step-1" hidden aria-hidden="true">
            <legend class="sr-only">Endereço</legend>

            <div class="input-field">
              <label class="input-field__label sr-only" for="cep">CEP</label>
              <input
                class="input-field__control"
                type="text"
                id="cep"
                name="cep"
                placeholder="CEP"
                inputmode="numeric"
                autocomplete="postal-code"
                aria-describedby="cep-erro"
              />
              <p class="input-field__error" id="cep-erro" role="alert"></p>
            </div>

            <div class="cadastro-form__row">
              <div class="input-field input-field--sm">
                <label class="input-field__label sr-only" for="uf">Estado</label>
                <input
                  class="input-field__control input-field__control--plain"
                  type="text"
                  id="uf"
                  name="uf"
                  placeholder="SP"
                  maxlength="2"
                  autocomplete="address-level1"
                  aria-describedby="uf-erro"
                />
                <p class="input-field__error" id="uf-erro" role="alert"></p>
              </div>

              <div class="input-field input-field--grow">
                <label class="input-field__label sr-only" for="cidade">Cidade</label>
                <input
                  class="input-field__control input-field__control--plain"
                  type="text"
                  id="cidade"
                  name="cidade"
                  placeholder="Cidade"
                  autocomplete="address-level2"
                  aria-describedby="cidade-erro"
                />
                <p class="input-field__error" id="cidade-erro" role="alert"></p>
              </div>

              <div class="input-field input-field--sm">
                <label class="input-field__label sr-only" for="numero">Número</label>
                <input
                  class="input-field__control input-field__control--plain"
                  type="text"
                  id="numero"
                  name="numero"
                  placeholder="N°"
                  inputmode="numeric"
                  autocomplete="address-line2"
                  aria-describedby="numero-erro"
                />
                <p class="input-field__error" id="numero-erro" role="alert"></p>
              </div>
            </div>

            <div class="input-field">
              <label class="input-field__label sr-only" for="bairro">Bairro</label>
              <input
                class="input-field__control input-field__control--plain"
                type="text"
                id="bairro"
                name="bairro"
                placeholder="Bairro"
                autocomplete="address-level3"
                aria-describedby="bairro-erro"
              />
              <p class="input-field__error" id="bairro-erro" role="alert"></p>
            </div>

            <div class="input-field">
              <label class="input-field__label sr-only" for="rua">Rua</label>
              <input
                class="input-field__control input-field__control--plain"
                type="text"
                id="rua"
                name="rua"
                placeholder="Rua"
                autocomplete="address-line1"
                aria-describedby="rua-erro"
              />
              <p class="input-field__error" id="rua-erro" role="alert"></p>
            </div>
          </fieldset>

          <ol class="stepper" aria-hidden="true">
            <li class="stepper__item" data-state="active"></li>
            <li class="stepper__item" data-state="upcoming"></li>
          </ol>

          <div class="cadastro-form__actions">
            <button type="button" id="btn-voltar" class="btn btn--ghost" hidden>
              Voltar
            </button>
            <button type="submit" id="btn-avancar" class="btn btn--cyan cadastro-form__submit">
              Avançar
            </button>
          </div>
        </form>
      </div>
    </main>

    <aside class="auth-layout__brand-panel" aria-hidden="true">
      <p class="auth-layout__brand-text">
        <span class="auth-layout__brand-title">Seu Vilarejo</span>
        <span class="auth-layout__brand-subtitle">Começa aqui!</span>
      </p>
    </aside>
  </div>

  <script type="module" src="../js/pages/cadastro.js"></script>
</body>
</html>
