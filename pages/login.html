<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fazer Login | Brinka</title>
  <meta name="description" content="Faça login na Brinka e comece a explorar o seu vilarejo." />

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/components/cadastro/base.css" />
  <link rel="stylesheet" href="/css/components/cadastro/buttons.css" />
  <link rel="stylesheet" href="/css/components/cadastro/inputs.css" />
  <link rel="stylesheet" href="/css/components/cadastro/auth-layout.css" />
  <link rel="stylesheet" href="/css/pages/login.css" />
</head>
<body>

  <!-- Skip link: permite que usuários de teclado pulem direto para o formulário -->
  <a class="skip-link" href="#login-form">Pular para o formulário de login</a>

  <div class="auth-layout">
    <main class="auth-layout__content">
      <div class="auth-layout__card">
        <header class="auth-header">
          <img
            class="auth-header__logo"
            src="/assets/icons/logo.svg"
            alt="Brinka"
            width="210"
            height="150"
          />
          <h1 class="auth-header__title">Fazer Login</h1>
          <p class="auth-header__subtitle">
            Insira suas informações para prosseguirmos com seu login
          </p>
        </header>

        <div
          id="form-feedback"
          class="form-feedback"
          role="alert"
          aria-live="assertive"
        ></div>

        <form id="login-form" class="cadastro-form" novalidate>

          <div class="input-field">
            <label class="input-field__label sr-only" for="email">E-mail</label>
            <input
              class="input-field__control"
              type="email"
              id="email"
              name="email"
              placeholder="E-mail"
              autocomplete="email"
              required
              aria-required="true"
              aria-describedby="email-error"
            />
            <p id="email-error" class="input-field__error" role="alert"></p>
          </div>

          <div class="input-field">
            <label class="input-field__label sr-only" for="password">Senha</label>
            <input
              class="input-field__control"
              type="password"
              id="password"
              name="password"
              placeholder="Senha"
              autocomplete="current-password"
              required
              aria-required="true"
              aria-describedby="password-error"
            />
            <button
              type="button"
              id="toggle-password"
              class="input-field__icon input-field__icon--button"
              aria-pressed="false"
              aria-label="Mostrar senha"
            >
              <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                <path d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7Zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9Z" fill="currentColor"/>
              </svg>
            </button>
            <p id="password-error" class="input-field__error" role="alert"></p>
          </div>

          <div class="cadastro-form__actions">
            <button type="submit" class="btn btn--cyan cadastro-form__submit">Avançar</button>
          </div>

        </form>
      </div>
    </main>

    <aside class="auth-layout__brand-panel" aria-hidden="true">
      <p class="auth-layout__brand-text">
        <span class="auth-layout__brand-title">Seu vilarejo começa aqui!</span>
      </p>
    </aside>
  </div>

  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
